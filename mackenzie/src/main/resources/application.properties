spring.application.name=mackenzie

# Banco (Supabase/PostgreSQL). Mesmas variáveis de ambiente usadas pelo ConexaoSupabase;
# a senha NUNCA deve ser gravada aqui: defina SUPABASE_DB_PASSWORD no ambiente.
spring.datasource.url=${SUPABASE_JDBC_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.wcljsklgabcmxqjnyalf}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# O esquema é criado pelo script db/estrutura-e-dados.sql (InicializadorBanco), não pelo Hibernate.
spring.jpa.hibernate.ddl-auto=none

# O Session pooler do Supabase limita conexões; o pool do Spring (Hikari) não precisa de mais que isso.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# Interface de console (menu). Use false para subir só a parte web.
app.console.enabled=true
