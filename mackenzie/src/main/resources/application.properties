spring.application.name=mackenzie

# A aplicação pode ser acessada por proxy HTTPS (por exemplo, encaminhamento de porta do Codespaces).
server.forward-headers-strategy=framework

# Banco PostgreSQL do Supabase, gerenciado pelo datasource do Spring.
# A senha não deve ser gravada aqui: defina SUPABASE_DB_PASSWORD no ambiente.
spring.datasource.url=${SUPABASE_JDBC_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.wcljsklgabcmxqjnyalf}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# O esquema e os dados iniciais são aplicados pelo inicializador SQL do Spring Boot.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/estrutura-e-dados.sql
spring.jpa.hibernate.ddl-auto=none

# O Session pooler do Supabase limita conexões; o pool do Spring (Hikari) não precisa de mais que isso.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# Interface de console (menu). Use false para subir só a parte web.
app.console.enabled=true
